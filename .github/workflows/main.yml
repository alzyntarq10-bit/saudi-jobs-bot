
name: Saudi Jobs Scheduler

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  publish-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Publish Saudi Jobs
        env:
          PUBLISH_SECRET: ${{ secrets.PUBLISH_SECRET }}
        run: |
          curl --fail --show-error --retry 3 --max-time 120 \
            -X POST \
            -H "x-publish-secret: ${PUBLISH_SECRET}" \
            https://saudi-jobs-bot.onrender.com/publish
