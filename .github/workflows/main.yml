
name: Saudi Jobs Scheduler

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  publish-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Saudi Jobs Publishing
        run: |
          curl --fail --retry 3 --max-time 120 \
            https://saudi-jobs-bot.onrender.com/publish
