
name: Saudi Jobs Scheduler

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: saudi-jobs-publishing
  cancel-in-progress: false

jobs:
  publish-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch job announcements
        run: node fetch-jobs.js

      - name: Publish to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const { formatJob } = require('./jobs');

          const sleep = ms =>
            new Promise(resolve => setTimeout(resolve, ms));

          const file = 'posted-jobs.json';

          async function sendTelegram(message) {
            for (let attempt = 1; attempt <= 5; attempt++) {
              const response = await fetch(
                'https://api.telegram.org/bot' +
                process.env.TELEGRAM_BOT_TOKEN +
                '/sendMessage',
                {
                  method: 'POST',
                  headers: {
                    'Content-Type': 'application/json'
                  },
                  body: JSON.stringify({
                    chat_id: process.env.CHANNEL_ID,
                    text: message
                  })
                }
              );

              const result = await response.json();

              if (result.ok) return true;

              if (result.error_code === 429) {
                const seconds =
                  result.parameters?.retry_after || 60;

                console.log(
                  `Telegram rate limit. Waiting ${seconds}s`
                );

                await sleep((seconds + 2) * 1000);
                continue;
              }

              throw new Error(
                result.description || 'Telegram error'
              );
            }

            throw new Error('Telegram retry limit reached');
          }

          async function main() {
            if (
              !process.env.TELEGRAM_BOT_TOKEN ||
              !process.env.CHANNEL_ID
            ) {
              throw new Error('Missing Telegram secrets');
            }

            const jobs = JSON.parse(
              fs.readFileSync('jobs-data.json', 'utf8')
            ).jobs || [];

            const history = JSON.parse(
              fs.readFileSync(file, 'utf8')
            );

            const posted = Array.isArray(history)
              ? history
              : (history.posted || []);

            const seen = new Set(posted);
            let sent = 0;

            for (const job of jobs) {
              if (!job.url || seen.has(job.url)) continue;

              const message = formatJob(job);
              if (!message) continue;

              await sendTelegram(message);

              posted.push(job.url);
              seen.add(job.url);
              sent++;

              fs.writeFileSync(
                file,
                JSON.stringify({ posted }, null, 2)
              );

              console.log(`Published job ${sent}`);

              await sleep(5000);
            }

            console.log('Total published:', sent);
          }

          main().catch(error => {
            console.error(error.message);
            process.exitCode = 1;
          });
          NODE

      - name: Save published jobs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs-data.json posted-jobs.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Saudi jobs data"
            git push
          fi
