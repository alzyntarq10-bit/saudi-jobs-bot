
name: Saudi Jobs Scheduler

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: saudi-jobs-publishing
  cancel-in-progress: false

jobs:
  publish-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Download project
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch Saudi jobs
        run: node fetch-jobs.js

      - name: Publish jobs to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const { formatJob } = require('./jobs');

          const sleep = ms =>
            new Promise(resolve => setTimeout(resolve, ms));

          async function main() {
            const token = process.env.TELEGRAM_BOT_TOKEN;
            const channel = process.env.CHANNEL_ID;

            if (!token || !channel) {
              throw new Error('Missing Telegram secrets');
            }

            const data = JSON.parse(
              fs.readFileSync('jobs-data.json', 'utf8')
            );

            const history = JSON.parse(
              fs.readFileSync('posted-jobs.json', 'utf8')
            );

            const posted = new Set(history.posted || []);
            let count = 0;

            for (const job of data.jobs || []) {
              const message = formatJob(job);
              const id = String(job.url || '').trim();

              if (!message || !id || posted.has(id)) {
                continue;
              }

              const response = await fetch(
                `https://api.telegram.org/bot${token}/sendMessage`,
                {
                  method: 'POST',
                  headers: {
                    'Content-Type': 'application/json'
                  },
                  body: JSON.stringify({
                    chat_id: channel,
                    text: message,
                    disable_web_page_preview: true
                  })
                }
              );

              const result = await response.json();

              if (!response.ok || !result.ok) {
                throw new Error(
                  `Telegram error: ${result.description}`
                );
              }

              posted.add(id);
              history.posted = [...posted];

              fs.writeFileSync(
                'posted-jobs.json',
                JSON.stringify(history, null, 2)
              );

              count++;
              console.log(`Published job ${count}`);

              await sleep(1500);
            }

            console.log(`Total published: ${count}`);
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Save published jobs
        if: always()
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add jobs-data.json posted-jobs.json

          if git diff --cached --quiet; then
            echo "No changes to save"
            exit 0
          fi

          git commit -m "Update Saudi jobs data"

          for attempt in 1 2 3 4 5; do
            echo "Save attempt: $attempt"

            git fetch origin main

            if ! git rebase origin/main; then
              echo "Rebase conflict detected"
              git rebase --abort || true
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "Jobs saved successfully"
              exit 0
            fi

            sleep 5
          done

          echo "Failed to save after 5 attempts"
          exit 1
