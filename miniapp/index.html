
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>وظائف السعودية</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script src="https://libtl.com/sdk.js"
 data-zone="12299617"
 data-sdk="show_12299617"></script>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Tahoma,Arial,sans-serif;
 background:#f2f5f3;
 color:#183e2d;
}

header{
 background:#08784e;
 color:white;
 text-align:center;
 padding:30px 15px;
}

header h1{
 margin:0 0 12px;
 font-size:28px;
}

main{
 max-width:650px;
 margin:auto;
 padding:16px;
}

input,select{
 width:100%;
 padding:14px;
 margin:7px 0;
 border:1px solid #ddd;
 border-radius:12px;
 font-size:16px;
 background:white;
}

#status{
 text-align:center;
 padding:20px;
}

.job{
 background:white;
 border-radius:16px;
 padding:20px;
 margin:16px 0;
 box-shadow:0 3px 10px #00000010;
}

.job h3{
 margin:0 0 12px;
 line-height:1.7;
}

.job p{
 color:#52645c;
 line-height:1.7;
}

.btn{
 display:block;
 width:100%;
 padding:15px;
 margin-top:12px;
 border:0;
 border-radius:11px;
 background:#08784e;
 color:white;
 text-align:center;
 text-decoration:none;
 font-size:16px;
 cursor:pointer;
}

.btn:disabled{
 opacity:.55;
 cursor:not-allowed;
}

.secondary{
 background:#e7eeea;
 color:#183e2d;
}

.modal{
 position:fixed;
 inset:0;
 background:#0009;
 display:none;
 align-items:center;
 justify-content:center;
 padding:18px;
 z-index:9999;
}

.modal.active{
 display:flex;
}

.panel{
 width:100%;
 max-width:430px;
 padding:24px;
 border-radius:18px;
 background:white;
 text-align:center;
}

.panel p{
 line-height:1.8;
}
</style>
</head>

<body>

<header>
<h1>🇸🇦 وظائف السعودية</h1>
<p>أحدث الفرص الوظيفية الحكومية والخاصة</p>
</header>

<main>

<input id="search"
 placeholder="🔍 ابحث عن وظيفة">

<select id="sector">
<option value="">جميع القطاعات</option>
<option value="حكومي">حكومية</option>
<option value="خاص">خاصة</option>
</select>

<input id="city"
 placeholder="المدينة: الرياض، جدة...">

<div id="status">جاري تحميل الوظائف...</div>
<div id="jobs"></div>

</main>

<div id="jobModal" class="modal">
<div class="panel">

<h2>🇸🇦 تفاصيل الوظيفة</h2>

<p id="modalStatus">
يمكنك الانتقال إلى الوظيفة مباشرة،
أو مشاهدة إعلان اختياري.
</p>

<button id="watchAd" class="btn">
▶️ مشاهدة إعلان
</button>

<a id="openJob"
 class="btn"
 href="#"
 target="_blank"
 rel="noopener noreferrer">
🔗 فتح رابط الوظيفة والتقديم
</a>

<button id="closeModal"
 class="btn secondary">
إغلاق
</button>

</div>
</div>

<script>
"use strict";

const tg=window.Telegram?.WebApp;
tg?.ready();
tg?.expand();

const root="/saudi-jobs-bot/jobs-data.json";

let jobs=[];

const search=document.getElementById("search");
const city=document.getElementById("city");
const sector=document.getElementById("sector");
const status=document.getElementById("status");
const box=document.getElementById("jobs");
const modal=document.getElementById("jobModal");
const modalStatus=document.getElementById("modalStatus");
const watchAd=document.getElementById("watchAd");
const openJob=document.getElementById("openJob");
const closeModal=document.getElementById("closeModal");

function safeUrl(value){
 try{
  const url=new URL(value);
  if(!["https:","http:"].includes(url.protocol)){
   return null;
  }
  return url.href;
 }catch{
  return null;
 }
}

function addText(parent,tag,value){
 const element=document.createElement(tag);
 element.textContent=String(value);
 parent.append(element);
 return element;
}

function render(){
 const q=search.value.trim().toLowerCase();
 const c=city.value.trim().toLowerCase();
 const s=sector.value;

 box.replaceChildren();

 const filtered=jobs.filter(j=>{
  const text=[
   j.title,
   j.company,
   j.city
  ].join(" ").toLowerCase();

  const jobCity=String(j.city||"").toLowerCase();
  const kind=String(j.sector||j.type||"");

  return text.includes(q)
   &&jobCity.includes(c)
   &&kind.includes(s);
 });

 status.textContent=filtered.length+" وظيفة متاحة";

 filtered.forEach(j=>{
  const card=document.createElement("article");
  card.className="job";

  addText(card,"h3",j.title||"وظيفة جديدة");

  if(j.company){
   addText(card,"p","🏢 "+j.company);
  }

  if(j.city){
   addText(card,"p","📍 "+j.city);
  }

  const url=safeUrl(j.url);

  if(url){
   const button=document.createElement("button");
   button.className="btn";
   button.textContent="عرض الوظيفة والتقديم";

   button.addEventListener("click",()=>{
    showJobOptions(url);
   });

   card.append(button);
  }

  box.append(card);
 });
}

function showJobOptions(url){
 openJob.href=url;

 modalStatus.textContent=
  "يمكنك فتح الوظيفة مباشرة أو مشاهدة إعلان اختياري.";

 watchAd.disabled=false;
 watchAd.textContent="▶️ مشاهدة إعلان";

 modal.classList.add("active");
}

closeModal.addEventListener("click",()=>{
 modal.classList.remove("active");
});

openJob.addEventListener("click",()=>{
 modal.classList.remove("active");
});

watchAd.addEventListener("click",async()=>{
 if(typeof window.show_12299617!=="function"){
  modalStatus.textContent=
   "الإعلان غير متاح الآن. يمكنك فتح الوظيفة مباشرة.";
  return;
 }

 watchAd.disabled=true;
 watchAd.textContent="جاري عرض الإعلان...";

 try{
  await window.show_12299617();

  modalStatus.textContent=
   "اكتمل الإعلان. يمكنك الآن فتح رابط الوظيفة.";
 }catch(error){
  console.warn("Monetag:",error);

  modalStatus.textContent=
   "تعذر إكمال الإعلان. رابط الوظيفة متاح مباشرة.";
 }finally{
  watchAd.disabled=false;
  watchAd.textContent="▶️ مشاهدة إعلان";
 }
});

async function load(){
 try{
  const response=await fetch(
   root+"?t="+Date.now(),
   {cache:"no-store"}
  );

  if(!response.ok){
   throw new Error("HTTP "+response.status);
  }

  const data=await response.json();

  jobs=Array.isArray(data)
   ?data
   :Array.isArray(data.jobs)
    ?data.jobs
    :[];

  render();
 }catch(error){
  console.error(error);
  status.textContent=
   "تعذر تحميل الوظائف. حاول لاحقًا.";
 }
}

search.addEventListener("input",render);
city.addEventListener("input",render);
sector.addEventListener("change",render);

load();
</script>

</body>
</html>
